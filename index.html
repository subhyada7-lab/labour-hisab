<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0757c9"><link rel="manifest" href="manifest.json">
<title>Labour Hisab Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui;background:#f3f6fb;color:#172033}
header{background:#0757c9;color:white;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0003}
.brand{display:flex;align-items:center;gap:10px;padding:12px 15px}.brand img{width:45px;height:45px;border-radius:12px}.brand b{font-size:20px}.brand small{display:block;opacity:.8}
nav{display:flex;overflow:auto;padding:0 8px 8px;gap:4px}nav button{background:#ffffff18;color:white;border:0;border-radius:9px;padding:9px 12px;white-space:nowrap}nav .on{background:white;color:#0757c9;font-weight:bold}
main{max-width:1050px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:white;border:1px solid #e2e8f0;border-radius:15px;padding:14px;box-shadow:0 3px 12px #17345a10}.stat span{font-size:12px;color:#6b7280}.stat b{display:block;font-size:23px;margin-top:5px}.g{color:#0a9b51}.r{color:#df3030}.o{color:#d88900}.b{color:#0757c9}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.action{padding:14px 7px;background:white;border:1px solid #e2e8f0;border-radius:13px;color:#0757c9;font-weight:bold}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.list{display:grid;gap:9px}.item{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:11px}
button,input,select{font:inherit}input,select{width:100%;padding:10px;border:1px solid #d7deea;border-radius:9px}label{font-size:12px;color:#6b7280;display:block;margin:8px 0 4px}.btn{border:0;background:#0757c9;color:white;border-radius:9px;padding:10px 13px;font-weight:bold}.green{background:#0a9b51}.red{background:#df3030}.light{background:#edf3ff;color:#0757c9}.form{max-width:430px;margin:35px auto;background:white;padding:22px;border-radius:22px;box-shadow:0 15px 45px #001b4d35}.form img{display:block;width:85px;margin:auto}.form h1{text-align:center}.muted{color:#6b7280;font-size:13px}
.att{display:grid;grid-template-columns:1fr repeat(4,auto);gap:5px;align-items:center}.att button{border:0;padding:7px 9px;border-radius:8px;background:#eef1f5}.selP{background:#dff7e8!important;color:#08783e}.selA{background:#ffe1df!important;color:#a52320}.selH{background:#fff0c5!important;color:#8b6200}.selO{background:#e5efff!important;color:#0757c9}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:end center;z-index:20}.sheet{background:white;width:min(600px,100%);padding:18px;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto}.hide{display:none!important}
footer{text-align:center;color:#6b7280;font-size:12px;padding:20px}footer a{color:#0757c9}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="login"><div class="form"><img src="icon.svg"><h1>LABOUR HISAB</h1><p class="muted" style="text-align:center">Work • Attendance • Payment</p>
<div id="signin"><label>Mobile Number</label><input id="phone" inputmode="numeric"><label>Password</label><input id="password" type="password"><button class="btn" style="width:100%;margin-top:12px" onclick="login()">Sign In</button><button class="btn light" style="width:100%;margin-top:8px" onclick="signupBox()">Create New Account</button></div>
<div id="signup" class="hide"><label>Name</label><input id="name"><label>Surname</label><input id="surname"><label>Company</label><input id="company"><label>Worker ₹/day</label><input id="rw" type="number" value="500"><label>Mistri ₹/day</label><input id="rm" type="number" value="1000"><label>Manager ₹/day</label><input id="rman" type="number" value="2000"><label>Mobile</label><input id="sp" inputmode="numeric"><label>Create password</label><input id="s1" type="password"><label>Confirm password</label><input id="s2" type="password"><button class="btn" style="width:100%;margin-top:12px" onclick="signup()">Create Account</button><button class="btn light" style="width:100%;margin-top:8px" onclick="signinBox()">Back</button></div>
</div></div>
<div id="app" class="hide"><header><div class="brand"><img src="icon.svg"><div><b>LABOUR HISAB</b><small>Smart App for Construction Business</small></div></div><nav>
<button data-t="home" onclick="tab('home')">Dashboard</button><button data-t="workers" onclick="tab('workers')">Workers</button><button data-t="attendance" onclick="tab('attendance')">Attendance</button><button data-t="payment" onclick="tab('payment')">Payment</button><button data-t="reports" onclick="tab('reports')">Reports</button><button data-t="sites" onclick="tab('sites')">Sites</button><button data-t="backup" onclick="tab('backup')">Backup</button><button data-t="settings" onclick="tab('settings')">Settings</button>
</nav></header><main id="main"></main><footer><a href="privacy-policy.html">Privacy Policy</a> · Offline-first · Phone · Laptop · PC</footer></div>
<div id="modal" class="modal hide" onclick="if(event.target.id==='modal')closeM()"><div id="sheet" class="sheet"></div></div>
<script>
const K='labour_hisab_pro';let D=JSON.parse(localStorage.getItem(K)||'null')||{profile:{},workers:[],projects:[],att:{},payments:[],income:[],expense:[]},T='home';
const save=()=>localStorage.setItem(K,JSON.stringify(D)),money=n=>'₹'+(+n||0).toLocaleString('en-IN'),uid=()=>Date.now()+Math.random();
function login(){if(!D.profile.phone){alert('Please create your account first.');return}if(phone.value!==D.profile.phone||password.value!==D.profile.password){alert('Wrong mobile number or password');return}openApp()}
function signupBox(){signin.classList.add('hide');signup.classList.remove('hide')}function signinBox(){signup.classList.add('hide');signin.classList.remove('hide')}
function signup(){if(!name.value||!sp.value||s1.value!==s2.value){alert('Fill required fields and check passwords');return}D.profile={name:name.value,surname:surname.value,company:company.value,phone:sp.value,password:s1.value,rates:{worker:+rw.value||500,mistri:+rm.value||1000,manager:+rman.value||2000}};save();alert('Account created');openApp()}
function openApp(){login.parentElement.classList.add('hide');app.classList.remove('hide');tab('home')}
function tab(t){T=t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));render()}
function totals(){let i=D.income.reduce((s,x)=>s+x.amount,0),e=D.expense.reduce((s,x)=>s+x.amount,0),due=0;D.workers.forEach(w=>{let earn=0;Object.values(D.att).forEach(day=>{let a=day[w.id];if(a==='P')earn+=w.rate;if(a==='H')earn+=w.rate/2;if(a==='O')earn+=w.rate*1.5});let paid=D.payments.filter(p=>p.w===w.id).reduce((s,p)=>s+p.amount,0);due+=Math.max(0,earn-paid)});return{i,e,due}}
function render(){let m=document.getElementById('main');if(T==='home')home(m);if(T==='workers')workers(m);if(T==='attendance')attendance(m);if(T==='payment')payment(m);if(T==='reports')reports(m);if(T==='sites')sites(m);if(T==='backup')backup(m);if(T==='settings')settings(m)}
function home(m){let t=totals();m.innerHTML='<p class="muted">Hello, <b>'+(D.profile.name||'Contractor')+'</b> 👋 · '+(D.profile.company||'Construction Business')+'</p><div class="grid"><div class="card stat b"><span>Total Projects</span><b>'+D.projects.filter(x=>!x.done).length+'</b></div><div class="card stat g"><span>Projects Completed</span><b>'+D.projects.filter(x=>x.done).length+'</b></div><div class="card stat g"><span>Overall Income</span><b>'+money(t.i)+'</b></div><div class="card stat r"><span>Overall Expenses</span><b>'+money(t.e)+'</b></div><div class="card stat o"><span>Overall Payables</span><b>'+money(t.due)+'</b></div><div class="card stat r"><span>Overall Liabilities</span><b>'+money(t.due)+'</b></div></div><div class="actions"><button class="action" onclick="tab('attendance')">📅<br>Attendance</button><button class="action" onclick="tab('payment')">₹<br>Payment</button><button class="action" onclick="tab('reports')">📊<br>Reports</button><button class="action" onclick="tab('sites')">🏗️<br>Projects</button></div><div class="card"><b>Daily Register</b><p class="muted">Mark attendance, calculate earnings automatically and record partial payments without allowing the balance to go below zero.</p></div>'}
function workers(m){m.innerHTML='<div class="row"><h2>Workers & Staff</h2><button class="btn" onclick="addWorker()">+ Add</button></div><div class="list">'+(D.workers.map(w=>'<div class="item row"><div><b>'+w.name+'</b><div class="muted">'+w.role+' · '+money(w.rate)+'/day</div></div><button class="btn light" onclick="editWorker(''+w.id+'')">Edit</button></div>').join('')||'<div class="card">No workers yet.</div>')+'</div>'}
function addWorker(){openM('<h2>Add Worker</h2><label>Name</label><input id="wn"><label>Role</label><select id="wr"><option>Worker</option><option>Mistri</option><option>Manager</option><option>Electrician</option><option>Carpenter</option><option>Painter</option></select><label>Daily rate</label><input id="rate" type="number" value="'+D.profile.rates.worker+'"><button class="btn" style="width:100%;margin-top:14px" onclick="saveW()">Save</button>')}
function saveW(){if(!wn.value)return;D.workers.push({id:String(uid()),name:wn.value,role:wr.value,rate:+rate.value||500});save();closeM();render()}
function editWorker(x){let w=D.workers.find(a=>a.id===x);openM('<h2>Edit Worker</h2><label>Name</label><input id="wn" value="'+w.name+'"><label>Role</label><input id="wr" value="'+w.role+'"><label>Rate</label><input id="rate" type="number" value="'+w.rate+'"><button class="btn" style="width:100%;margin-top:14px" onclick="w.name=wn.value;w.role=wr.value;w.rate=+rate.value;save();closeM();render()">Save</button>')}
function attendance(m){let d=new Date().toISOString().slice(0,10),day=D.att[d]||{};m.innerHTML='<div class="row"><h2>Daily Attendance</h2><input id="date" type="date" value="'+d+'" onchange="render()"></div><div class="list">'+(D.workers.map(w=>{let a=day[w.id]||'A';return '<div class="card att"><div><b>'+w.name+'</b><div class="muted">'+w.role+'</div></div><button class="'+(a==='P'?'selP':'')+'" onclick="mark(''+d+'',''+w.id+'','P')">P</button><button class="'+(a==='A'?'selA':'')+'" onclick="mark(''+d+'',''+w.id+'','A')">A</button><button class="'+(a==='H'?'selH':'')+'" onclick="mark(''+d+'',''+w.id+'','H')">HF</button><button class="'+(a==='O'?'selO':'')+'" onclick="mark(''+d+'',''+w.id+'','O')">OT</button></div>'}).join('')||'<div class="card">Add workers first.</div>')+'</div>'}
function mark(d,w,a){D.att[d]??={};D.att[d][w]=a;save();render()}
function payment(m){let arr=[];D.workers.forEach(w=>{let earn=0;Object.values(D.att).forEach(day=>{let a=day[w.id];if(a==='P')earn+=w.rate;if(a==='H')earn+=w.rate/2;if(a==='O')earn+=w.rate*1.5});let paid=D.payments.filter(p=>p.w===w.id).reduce((s,p)=>s+p.amount,0),bal=Math.max(0,earn-paid);if(bal)arr.push({w,earn,paid,bal})});m.innerHTML='<h2>Payment & Hisab</h2><div class="list">'+(arr.map(x=>'<div class="item row"><div><b>'+x.w.name+'</b><div class="muted">Earned '+money(x.earn)+' · Paid '+money(x.paid)+'</div></div><div><b class="r">'+money(x.bal)+'</b> <button class="btn green" onclick="pay(''+x.w.id+'','+x.bal+')">Pay</button></div></div>').join('')||'<div class="card">No pending payment 👍</div>')+'</div>'}
function pay(w,max){openM('<h2>Record Payment</h2><label>Amount (max '+money(max)+')</label><input id="amt" type="number" value="'+max+'"><label>Note</label><input id="note" placeholder="Partial / advance / cash"><button class="btn green" style="width:100%;margin-top:14px" onclick="savePay(''+w+'','+max+')">Save Payment</button>')}
function savePay(w,max){let a=Math.min(Math.max(+amt.value||0,0),max);if(!a)return;D.payments.push({w,amount:a,date:new Date().toISOString(),note:note.value});D.expense.push({amount:a,desc:'Worker payment',date:new Date().toISOString()});save();closeM();render()}
function reports(m){let p=0,h=0,a=0,o=0;Object.values(D.att).forEach(x=>Object.values(x).forEach(v=>{if(v==='P')p++;if(v==='H')h++;if(v==='A')a++;if(v==='O')o++}));let t=totals();m.innerHTML='<h2>Reports</h2><div class="grid"><div class="card stat g"><span>Present</span><b>'+p+'</b></div><div class="card stat o"><span>Half Day</span><b>'+h+'</b></div><div class="card stat r"><span>Absent</span><b>'+a+'</b></div><div class="card stat b"><span>Overtime</span><b>'+o+'</b></div><div class="card stat g"><span>Income</span><b>'+money(t.i)+'</b></div><div class="card stat r"><span>Expenses</span><b>'+money(t.e)+'</b></div></div><div class="card" style="margin-top:12px"><button class="btn" onclick="window.print()">Print / Save PDF</button></div>'}
function sites(m){m.innerHTML='<div class="row"><h2>Projects / Sites</h2><button class="btn" onclick="project()">+ Project</button></div><div class="list">'+(D.projects.map(p=>'<div class="item row"><div><b>'+p.name+'</b><div class="muted">'+(p.client||'')+' · '+(p.address||'')+'</div></div>'+(p.done?'✅ Completed':'<button class="btn light" onclick="done(''+p.id+'')">Complete</button>')+'</div>').join('')||'<div class="card">No projects yet.</div>')+'</div>'}
function project(){openM('<h2>New Project</h2><label>Project name</label><input id="pn"><label>Client</label><input id="pc"><label>Address</label><input id="pa"><label>Phone</label><input id="pp"><button class="btn" style="width:100%;margin-top:14px" onclick="saveProject()">Save</button>')}
function saveProject(){if(!pn.value)return;D.projects.push({id:String(uid()),name:pn.value,client:pc.value,address:pa.value,phone:pp.value,done:false});save();closeM();render()}function done(x){D.projects.find(p=>p.id===x).done=true;save();render()}
function backup(m){m.innerHTML='<h2>Backup & Restore</h2><div class="card"><p class="muted">Your records stay on this device and work offline. No automatic deletion.</p><button class="btn" onclick="downloadBackup()">Download Backup</button> <button class="btn light" onclick="file.click()">Restore Backup</button><input id="file" class="hide" type="file" accept=".json" onchange="restore(this)"></div>'}
function downloadBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='labour-hisab-backup.json';a.click()}function restore(x){let r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();render();alert('Backup restored')}catch(e){alert('Invalid backup')}};r.readAsText(x.files[0])}
function settings(m){m.innerHTML='<h2>Settings</h2><div class="list"><div class="card"><b>'+((D.profile.name||'')+' '+(D.profile.surname||''))+'</b><p class="muted">'+(D.profile.company||'')+' · '+(D.profile.phone||'')+'</p></div><div class="card"><b>Fixed rates</b><p class="muted">Worker '+money(D.profile.rates?.worker||500)+'/day · Mistri '+money(D.profile.rates?.mistri||1000)+'/day · Manager '+money(D.profile.rates?.manager||2000)+'/day</p></div><div class="card"><b>Security & Privacy</b><p class="muted">Offline-first local storage. Use Backup before changing devices.</p><a href="privacy-policy.html">Privacy Policy →</a></div></div>'}
function openM(x){sheet.innerHTML=x;modal.classList.remove('hide')}function closeM(){modal.classList.add('hide')}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
