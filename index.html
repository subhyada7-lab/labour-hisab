<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labour Hisab</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 12px; background: #f4f7fe; color: #101a2e; }
    header { background: #1264e8; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    input, select, button { width: 100%; padding: 10px; margin: 6px 0 12px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button.primary { background: #1264e8; color: white; border: none; font-weight: bold; cursor: pointer; }
    .worker { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<header>
  <h2 style="margin:0;">🔨 Labour Hisab</h2>
</header>

<div class="card">
  <h3>🎙️ AI बोलकर हाजिरी लगाएँ</h3>
  <button class="primary" onclick="startAI()" style="background:#28a745;">🎤 बोलें (AI Voice)</button>
  <p id="aiStatus" style="font-size:12px; color:gray; text-align:center;">बटन दबाकर बोलें: "रमेश प्रेजेंट"</p>
</div>

<div class="card">
  <h3>➕ मजदूर जोड़ें</h3>
  <label>नाम:</label>
  <input type="text" id="wName" placeholder="जैसे: रमेश">
  <label>दिहाड़ी (₹):</label>
  <input type="number" id="wRate" placeholder="जैसे: 500">
  <label>📷 फोटो (ऐच्छिक):</label>
  <input type="file" id="wPhoto" accept="image/*" capture="environment">
  <button class="primary" onclick="addWorker()">जोड़ें</button>
</div>

<div class="card">
  <h3>📋 मजदूरों की लिस्ट</h3>
  <div id="labourList"></div>
</div>

<script>
  let db = JSON.parse(localStorage.getItem('labour_db') || '{"workers":[]}');

  function saveDB() {
    localStorage.setItem('labour_db', JSON.stringify(db));
    renderWorkers();
  }

  function addWorker() {
    const name = document.getElementById('wName').value.trim();
    const rate = document.getElementById('wRate').value || 0;
    const photoInput = document.getElementById('wPhoto');

    if (!name) return alert('कृपया नाम लिखें!');

    if (photoInput && photoInput.files && photoInput.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        db.workers.push({ id: Date.now(), name: name, rate: rate, photo: e.target.result });
        saveDB();
        document.getElementById('wName').value = '';
        document.getElementById('wRate').value = '';
      };
      reader.readAsDataURL(photoInput.files[0]);
    } else {
      db.workers.push({ id: Date.now(), name: name, rate: rate, photo: '' });
      saveDB();
      document.getElementById('wName').value = '';
      document.getElementById('wRate').value = '';
    }
  }

  function renderWorkers() {
    const list = document.getElementById('labourList');
    if (!db.workers.length) {
      list.innerHTML = '<p style="color:gray;">कोई मजदूर नहीं जोड़ा गया</p>';
      return;
    }
    list.innerHTML = db.workers.map(w => {
      const img = w.photo ? `<img src="${w.photo}" style="width:35px;height:35px;border-radius:50%;margin-right:8px;vertical-align:middle;object-fit:cover;">` : '👤 ';
      return `<div class="worker"><div>${img}<b>${w.name}</b></div><div>₹${w.rate}</div></div>`;
    }).join('');
  }

  function startAI() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return alert('आपके ब्राउज़र में AI वॉइस सपोर्ट नहीं है।');
    
    const rec = new SpeechRecognition();
    rec.lang = 'hi-IN';
    document.getElementById('aiStatus').innerText = "सुन रहा हूँ... बोलिए...";
    rec.start();

    rec.onresult = (e) => {
      const text = e.results[0][0].transcript;
      document.getElementById('aiStatus').innerText = 'आपने कहा: "' + text + '"';
      alert('AI ने सुना: ' + text);
    };

    rec.onerror = () => {
      document.getElementById('aiStatus').innerText = "आवाज समझ नहीं आई, फिर से कोशिश करें।";
    };
  }

  renderWorkers();
</script>

</body>
</html>
