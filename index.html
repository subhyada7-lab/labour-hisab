<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labour Hisab - Construction Management</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #dbe4f0; color: #0f172a; padding-bottom: 75px; }
        .app-header { background-color: #002366; color: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-logo-box { width: 44px; height: 44px; background-color: #f7a01d; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .app-title-container h1 { font-size: 18px; font-weight: 700; }
        .app-title-container p { font-size: 11px; color: #93c5fd; }
        .lang-select { background-color: rgba(255, 255, 255, 0.15); color: white; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px; padding: 4px 12px; font-size: 13px; outline: none; cursor: pointer; }
        
        .top-nav { background-color: white; display: flex; justify-content: space-around; padding: 10px 8px 0 8px; border-radius: 0 0 16px 16px; margin-bottom: 12px; }
        .top-nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: #475569; padding-bottom: 8px; cursor: pointer; width: 25%; font-weight: 500; }
        .top-nav-item.active { color: #0052cc; font-weight: 700; border-bottom: 3px solid #0052cc; }

        .main-content { padding: 0 12px; max-width: 600px; margin: 0 auto; }
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
        .metric-card { background: white; border-radius: 14px; padding: 12px 10px; display: flex; flex-direction: column; justify-content: space-between; min-height: 105px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .metric-val { font-weight: 800; font-size: 16px; margin-top: 8px; color: #0f172a; }
        .metric-title { font-size: 10px; color: #475569; margin-top: 2px; }

        .section-card { background: white; border-radius: 16px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .section-title { font-size: 15px; font-weight: 700; }

        .quick-actions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; }
        .action-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
        .action-icon-circle { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .action-label { font-size: 11px; color: #334155; font-weight: 500; }

        .summary-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin-bottom: 12px; }
        .stat-box { border-radius: 12px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; }
        .stat-number { font-weight: 800; font-size: 18px; }
        .stat-text { font-size: 11px; margin-top: 4px; font-weight: 600; }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h3 { font-size: 16px; }
        .close-btn { font-size: 20px; cursor: pointer; color: #64748b; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        .submit-btn { width: 100%; padding: 10px; background: #0052cc; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .fab-center { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background-color: #0052cc; color: white; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 12px rgba(0, 82, 204, 0.4); cursor: pointer; z-index: 101; }
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: white; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #e2e8f0; z-index: 100; }
        .bottom-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #64748b; text-decoration: none; width: 20%; }
        .bottom-item.active { color: #0052cc; font-weight: 700; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-left">
            <div class="app-logo-box">
                <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
                    <path d="M8 56H56V60H8V56Z" fill="#002366"/>
                    <path d="M14 56V26L32 12L50 26V56H14Z" fill="#FFFFFF"/>
                    <path d="M22 34H28V56H22V34Z" fill="#002366"/>
                </svg>
            </div>
            <div class="app-title-container">
                <h1>Labour Hisab</h1>
                <p>Construction Management</p>
            </div>
        </div>
        <select class="lang-select" id="langSelect">
            <option value="hi">हिंदी</option>
            <option value="en">English</option>
        </select>
    </header>

    <nav class="top-nav">
        <div class="top-nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></div>
        <div class="top-nav-item"><i class="fa-solid fa-users"></i><span>Workers</span></div>
        <div class="top-nav-item"><i class="fa-solid fa-calendar-days"></i><span>Attendance</span></div>
        <div class="top-nav-item"><i class="fa-solid fa-indian-rupee-sign"></i><span>Payment</span></div>
    </nav>

    <main class="main-content">
        <div class="metrics-grid">
            <div class="metric-card" style="background: #eef6ff;">
                <div class="metric-val" id="totalWorkersCnt">0</div>
                <div class="metric-title">Total Workers</div>
            </div>
            <div class="metric-card" style="background: #f0fdf4;">
                <div class="metric-val" id="totalPaidVal">₹ 0</div>
                <div class="metric-title">Total Paid</div>
            </div>
            <div class="metric-card" style="background: #fffbeb;">
                <div class="metric-val" id="totalPendingVal">₹ 0</div>
                <div class="metric-title">Payables</div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-header"><span class="section-title">Quick Actions</span></div>
            <div class="quick-actions-grid">
                <div class="action-item" onclick="openWorkerModal()">
                    <div class="action-icon-circle" style="background: #e0f2fe; color: #0284c7;"><i class="fa-solid fa-user-plus"></i></div>
                    <span class="action-label">Add Worker</span>
                </div>
                <div class="action-item" onclick="alert('Feature coming in next tab!')">
                    <div class="action-icon-circle" style="background: #dcfce7; color: #16a34a;"><i class="fa-solid fa-calendar-check"></i></div>
                    <span class="action-label">Attendance</span>
                </div>
                <div class="action-item" onclick="alert('Feature coming in next tab!')">
                    <div class="action-icon-circle" style="background: #f3e8ff; color: #9333ea;"><i class="fa-solid fa-hand-holding-dollar"></i></div>
                    <span class="action-label">Add Payment</span>
                </div>
                <div class="action-item" onclick="alert('Reports section ready!')">
                    <div class="action-icon-circle" style="background: #ffedd5; color: #ea580c;"><i class="fa-solid fa-folder-closed"></i></div>
                    <span class="action-label">Reports</span>
                </div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-header"><span class="section-title">Today's Attendance</span></div>
            <div class="summary-stats-grid">
                <div class="stat-box" style="background: #f0fdf4;"><span class="stat-number" style="color: #16a34a;" id="presentCount">0</span><span class="stat-text" style="color: #16a34a;">Present</span></div>
                <div class="stat-box" style="background: #fff1f2;"><span class="stat-number" style="color: #e11d48;" id="absentCount">0</span><span class="stat-text" style="color: #e11d48;">Absent</span></div>
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div class="modal" id="workerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Worker</h3>
                <span class="close-btn" onclick="closeWorkerModal()">&times;</span>
            </div>
            <form id="workerForm">
                <div class="form-group">
                    <label>Worker Name</label>
                    <input type="text" id="wName" required placeholder="Enter name">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="wRole">
                        <option>Mistri (Mason)</option>
                        <option>Labour (Helper)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Daily Wage Rate (₹)</label>
                    <input type="number" id="wRate" required placeholder="e.g. 600">
                </div>
                <button type="submit" class="submit-btn">Save Worker</button>
            </form>
        </div>
    </div>

    <div class="fab-center" onclick="openWorkerModal()"><i class="fa-solid fa-plus"></i></div>

    <nav class="bottom-bar">
        <a href="#" class="bottom-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#" class="bottom-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
    </nav>

    <script>
        let workers = JSON.parse(localStorage.getItem('labour_data')) || [];

        function updateUI() {
            document.getElementById('totalWorkersCnt').innerText = workers.length;
            localStorage.setItem('labour_data', JSON.stringify(workers));
        }

        function openWorkerModal() { document.getElementById('workerModal').style.display = 'flex'; }
        function closeWorkerModal() { document.getElementById('workerModal').style.display = 'none'; }

        document.getElementById('workerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('wName').value;
            const role = document.getElementById('wRole').value;
            const rate = document.getElementById('wRate').value;

            workers.push({ name, role, rate });
            updateUI();
            closeWorkerModal();
            this.reset();
            alert('Worker added successfully!');
        });

        updateUI();
    </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW Registered!', reg))
        .catch(err => console.log('SW Error:', err));
    });
  }
</script>
    
</body>
</html>
